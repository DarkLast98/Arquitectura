name: Docker I1 (desarrollo)

on:
  pull_request:
    paths:
      - "compose.yaml"
      - ".dockerignore"
      - "docker/**"
      - "scripts/docker_*.py"
      - ".github/workflows/docker-i1.yml"
  workflow_dispatch:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar estructura Compose
        run: docker compose config --quiet
      - name: Construir y arrancar entorno sintético
        run: docker compose up --build -d
      - name: Verificar contrato, HTTPS y OIDC
        run: docker compose run --rm --no-deps setup python3 scripts/docker_smoke.py
      - name: Diagnóstico de errores
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=120 || true
      - name: Limpiar entorno de CI
        if: always()
        run: docker compose down -v --remove-orphans || true
